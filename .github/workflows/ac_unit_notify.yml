name: AC Unit Checkout Notifier

# Runs every 90 minutes. GitHub throttles high-frequency cron on shared
# runners — the previous */30 schedule actually fired about every 80 minutes
# (18:57, 20:25, 21:37, 23:01), so this matches the real cadence instead of
# advertising one it never hit.
on:
  schedule:
    - cron: "0 0/3 * * *"
    - cron: "30 1/3 * * *"
  workflow_dispatch:

# Overlapping runs would both read the same seen-IDs state and each send a
# notification for the same checkout — duplicate emails to the recipients.
concurrency:
  group: ac-unit-notify
  cancel-in-progress: false

# SETUP REQUIRED — one-time steps before this workflow will work:
#
# 1. Azure app permissions:
#    In your Azure app registration (same one used for OneDrive), add:
#      Application permission: Mail.Send
#    Then grant admin consent.
#
# 2. (Recommended) Restrict Mail.Send to the sending mailbox only:
#    Run in Exchange Online PowerShell:
#      New-ApplicationAccessPolicy -AppId <AZURE_CLIENT_ID> \
#        -PolicyScopeGroupId <sending mailbox> \
#        -AccessRight RestrictAccess \
#        -Description "Limit mail send to the sending mailbox"
#
# 3. GitHub secrets: the photo sync's SNIPE_URL, SNIPE_API_KEY,
#    AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET, plus
#    NOTIFY_FROM_EMAIL (the sending mailbox) and NOTIFY_TO_EMAILS
#    (comma-separated recipients). Addresses are secrets, not variables,
#    because Actions prints variable values in the public run log.
#
# 4. GitHub variable (optional):
#    NOTIFY_CATEGORY = AC Units   (this is the default)

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r notifications/requirements.txt

      - name: Restore notifier state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ac_notify_state.json
          key: ac-notify-state-${{ github.run_id }}
          restore-keys: |
            ac-notify-state-

      - name: Run notifier
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
          # A secret, not a variable: Actions prints variable values in the
          # public run log, and masks secrets.
          NOTIFY_TO_EMAILS: ${{ secrets.NOTIFY_TO_EMAILS }}
          NOTIFY_CATEGORY: ${{ vars.NOTIFY_CATEGORY || 'AC Units' }}
          NOTIFY_STATE_PATH: ac_notify_state.json
        run: python notifications/notifier.py

      # Persist successful sends even if a later notification fails. The
      # combined cache action skips its post-save when a job exits nonzero,
      # which can otherwise cause the successful email to be sent again.
      - name: Save notifier state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ac_notify_state.json
          key: ac-notify-state-${{ github.run_id }}
