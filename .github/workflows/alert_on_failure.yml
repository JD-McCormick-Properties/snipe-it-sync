name: Alert On Failure

# Watches the scheduled jobs and emails when one does not succeed.
#
# The syncs exit non-zero when a write is rejected, not only when they crash,
# so this covers the silent-failure case too: a run that reports success while
# writing nothing now fails, and fails loudly.
#
# Set the ALERT_TO_EMAILS repository variable to whoever maintains this repo.
# It is deliberately separate from NOTIFY_TO_EMAILS — an AC unit checkout goes
# to the office, a sync failure does not. Unset, the alert is skipped.
on:
  workflow_run:
    workflows:
      - "Property Sync"
      - "Photo Sync (Snipe-IT → OneDrive)"
      - "AC Unit Checkout Notifier"
      - "Tests"
      - "CodeQL"
    types: [completed]
  # Manual trigger so the mail path can be exercised without deliberately
  # breaking a sync. Sends a clearly-labelled test to ALERT_TO_EMAILS.
  workflow_dispatch:

jobs:
  alert:
    # Failures, plus cancelled runs so the next step can pick out timeouts.
    # A manual run has no workflow_run context and is allowed through so the
    # mail path stays testable.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    # Sending one email takes seconds; anything longer is stuck.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read

    steps:
      # Most cancellations need no email: GitHub cancels jobs during
      # infrastructure trouble, and the concurrency group cancels a run
      # superseded by a newer one — on 2026-08-06 three such notifier runs
      # produced alerts for a script that never ran. But GitHub also reports a
      # job that hit its timeout-minutes as a cancelled run, never as
      # timed_out, so a hang went unreported (photo sync, 2026-08-18, 08-19,
      # 09-30). The job's own annotation is what tells the two apart.
      - name: Decide whether to alert
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || 'test' }}
        run: |
          send=true
          if [ "$CONCLUSION" = "cancelled" ]; then
            send=false
            jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[].id')
            for job in $jobs; do
              messages=$(gh api "repos/$REPO/check-runs/$job/annotations" --jq '.[].message')
              if grep -q 'exceeded the maximum execution time' <<<"$messages"; then
                send=true
                CONCLUSION=timed_out
              fi
            done
          fi
          echo "Run concluded $CONCLUSION; send=$send"
          echo "send=$send" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

      - if: steps.decide.outputs.send == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.decide.outputs.send == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - if: steps.decide.outputs.send == 'true'
        working-directory: notifications
        run: pip install -r requirements.txt

      - name: Send alert
        if: steps.decide.outputs.send == 'true'
        working-directory: notifications
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          NOTIFY_FROM_EMAIL: ${{ vars.NOTIFY_FROM_EMAIL }}
          ALERT_TO_EMAILS: ${{ vars.ALERT_TO_EMAILS }}
          ALERT_WORKFLOW: ${{ github.event.workflow_run.name || 'Manual alert test' }}
          ALERT_CONCLUSION: ${{ steps.decide.outputs.conclusion }}
          ALERT_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          ALERT_RUN_NUMBER: ${{ github.event.workflow_run.run_number || github.run_number }}
          ALERT_REPO: ${{ github.repository }}
        run: python alert.py
