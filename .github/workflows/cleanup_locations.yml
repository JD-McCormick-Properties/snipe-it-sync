name: Cleanup Stutter Locations

# Manual only. Lists redundant "X - X" sublocations by default; deleting
# requires explicitly setting delete to "true".
on:
  workflow_dispatch:
    inputs:
      delete:
        description: 'Actually delete (leave "false" to just list them)'
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: property-sync
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
      - working-directory: property_sync
        run: pip install -r requirements.txt
      - name: Run cleanup
        working-directory: property_sync
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.delete }}" = "true" ]; then
            python cleanup_stutter_locations.py --delete
          else
            python cleanup_stutter_locations.py
          fi
