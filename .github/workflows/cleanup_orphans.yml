name: Cleanup Orphaned Thumbnails

# Manual only. Reports leftover thumbnail uploads by default; deleting
# requires explicitly setting the delete input to "true".
on:
  workflow_dispatch:
    inputs:
      delete:
        description: 'Actually delete the files (leave "false" to just list them)'
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      which:
        description: "Which pass to run"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "thumbnails"
          - "duplicates"

concurrency:
  group: photo-sync
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: photo_sync
        run: pip install -r requirements.txt

      # Read-only: the cleanup needs the DB to know which files the sync
      # uploaded, but must never write it back and change sync state.
      - name: Restore dedupe DB
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: photo_sync/photo_sync_state.db
          key: photo-sync-db-never-matches
          restore-keys: |
            photo-sync-db-

      - name: Run cleanup
        working-directory: photo_sync
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_BASE_FOLDER: ${{ vars.ONEDRIVE_BASE_FOLDER || 'AssetPhotos' }}
          LOG_LEVEL: INFO
        run: |
          ARGS="--pass ${{ github.event.inputs.which }}"
          if [ "${{ github.event.inputs.delete }}" = "true" ]; then
            ARGS="$ARGS --delete"
          fi
          python cleanup_orphans.py $ARGS
