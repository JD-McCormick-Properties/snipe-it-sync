name: Diagnose Location Name
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Location name to investigate"
        required: true
        default: "2898-202"
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
        run: python diagnose_name.py "${{ github.event.inputs.name }}"
