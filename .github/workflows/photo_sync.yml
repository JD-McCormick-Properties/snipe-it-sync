name: Photo Sync (Snipe-IT → OneDrive)

on:
  schedule:
    # Every 2 hours so asset image updates (check-in/out photos) land in
    # OneDrive within ~2 hours of a tech uploading them.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-upload everything (ignore dedupe DB)"
        required: false
        default: "false"

# Two syncs must never overlap: they restore the same dedupe DB snapshot,
# duplicate each other's uploads, and only one's cache save survives — so the
# other's record of what it uploaded is lost and re-uploaded next run.
concurrency:
  group: photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: photo_sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('photo_sync/requirements.txt') }}

      - name: Install Playwright Chromium
        working-directory: photo_sync
        run: python -m playwright install --with-deps chromium

      - name: Restore dedupe DB
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: photo_sync/photo_sync_state.db
          key: photo-sync-db-${{ github.run_id }}
          restore-keys: |
            photo-sync-db-

      - name: Run sync
        working-directory: photo_sync
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_BASE_FOLDER: ${{ vars.ONEDRIVE_BASE_FOLDER || 'AssetPhotos' }}
          WRITE_BACK_TO_SNIPEIT: ${{ vars.WRITE_BACK_TO_SNIPEIT || 'false' }}
          INCLUDE_HISTORY_NOTES: ${{ vars.INCLUDE_HISTORY_NOTES || 'true' }}
          USE_PLAYWRIGHT: ${{ vars.USE_PLAYWRIGHT || 'true' }}
          FORCE_RESYNC: ${{ github.event.inputs.force || 'false' }}
          LOG_LEVEL: INFO
        run: python sync.py

      # Keep records for files uploaded before a later item failed. Without
      # this explicit save, a red run can restore an older DB next time and
      # upload the successful files again.
      - name: Save dedupe DB
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: photo_sync/photo_sync_state.db
          key: photo-sync-db-${{ github.run_id }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: photo-sync-state
          path: photo_sync/photo_sync_state.db
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: photo-sync-debug
          path: photo_sync/_debug/
          if-no-files-found: ignore
          retention-days: 14
