name: Photo Sync (Snipe-IT → OneDrive)

on:
  schedule:
    # Every 2 hours so asset image updates (check-in/out photos) land in
    # OneDrive within ~2 hours of a tech uploading them.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-upload everything (ignore dedupe DB)"
        required: false
        default: "false"

# Two syncs must never overlap: they restore the same dedupe DB snapshot,
# duplicate each other's uploads, and only one's cache save survives — so the
# other's record of what it uploaded is lost and re-uploaded next run.
concurrency:
  group: photo-sync
  cancel-in-progress: false

jobs:
  sync:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26.04 between
    # 2026-10-19 and 2026-11-19. Playwright's --with-deps installs OS packages
    # by distro release, and Chromium was not supported on 26.04 when that
    # migration was announced. Move this deliberately once it is.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: photo_sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('photo_sync/requirements.txt') }}

      # The browser usually comes from the cache, but --with-deps still runs
      # apt-get, and apt has no overall time limit. A stalled Ubuntu mirror hung
      # this step on 2026-08-18, 08-19 and 09-30 — twice for the 6-hour default
      # — and every sync queued behind it was dropped. A normal install takes
      # under 30 seconds, so each attempt is capped at 5 minutes and retried.
      # Three failures in a row fail the step, which fails the run and alerts.
      - name: Install Playwright Chromium
        working-directory: photo_sync
        timeout-minutes: 20
        run: |
          # apt's own network limits, so a stalled download errors and is
          # retried (from the next mirror in the runner's mirror list) within
          # seconds instead of using up a whole attempt. The lock timeout makes
          # apt wait briefly for a straggler rather than fail on the spot.
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'DPkg::Lock::Timeout "60";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null

          for attempt in 1 2 3; do
            if timeout --kill-after=30s 5m python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt failed or stalled"
            # The timeout stops Playwright but not the apt-get it launched
            # through sudo. On 2026-10-22 that apt-get kept running and held
            # the dpkg lock, so attempts 2 and 3 failed in seconds on the lock
            # instead of retrying. Stop it, then let dpkg finish anything a
            # kill interrupted.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -f '^/usr/lib/apt/methods/' || true
            sudo pkill -9 -x dpkg || true
            sleep 5
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "::error::Playwright install failed 3 times"
          exit 1

      - name: Restore dedupe DB
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: photo_sync/photo_sync_state.db
          key: photo-sync-db-${{ github.run_id }}
          restore-keys: |
            photo-sync-db-

      - name: Run sync
        working-directory: photo_sync
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_BASE_FOLDER: ${{ vars.ONEDRIVE_BASE_FOLDER || 'AssetPhotos' }}
          WRITE_BACK_TO_SNIPEIT: ${{ vars.WRITE_BACK_TO_SNIPEIT || 'false' }}
          INCLUDE_HISTORY_NOTES: ${{ vars.INCLUDE_HISTORY_NOTES || 'true' }}
          USE_PLAYWRIGHT: ${{ vars.USE_PLAYWRIGHT || 'true' }}
          FORCE_RESYNC: ${{ github.event.inputs.force || 'false' }}
          LOG_LEVEL: INFO
        run: python sync.py

      # Keep records for files uploaded before a later item failed. Without
      # this explicit save, a red run can restore an older DB next time and
      # upload the successful files again.
      - name: Save dedupe DB
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: photo_sync/photo_sync_state.db
          key: photo-sync-db-${{ github.run_id }}

      # No run artifacts. The dedupe DB used to be uploaded as one, but
      # artifacts on a public repository can be downloaded by anyone signed in
      # to GitHub, and the DB lists asset tags, OneDrive links and file names
      # with employee names in them. The cache above is how the DB persists.
