name: Photo Sync (Snipe-IT → OneDrive)

on:
  schedule:
    # Every 2 hours so asset image updates (check-in/out photos) land in
    # OneDrive within ~2 hours of a tech uploading them.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-upload everything (ignore dedupe DB)"
        required: false
        default: "false"

# Two syncs must never overlap: they restore the same dedupe DB snapshot,
# duplicate each other's uploads, and only one's cache save survives — so the
# other's record of what it uploaded is lost and re-uploaded next run.
concurrency:
  group: photo-sync
  cancel-in-progress: false

jobs:
  sync:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26.04 between
    # 2026-10-19 and 2026-11-19. Playwright's --with-deps installs OS packages
    # by distro release, and Chromium was not supported on 26.04 when that
    # migration was announced. Move this deliberately once it is.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: photo_sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('photo_sync/requirements.txt') }}

      # Only the browser, never --with-deps. Every library headless Chromium
      # needs is already on the ubuntu-24.04 image; --with-deps added ~26 MB of
      # CJK and Unicode fonts from the runner's Ubuntu mirror on every run,
      # useful only for rendering text in screenshots, which the sync never
      # does. That mirror crawled (down to ~40 KB/s) and failed the sync on
      # 2026-08-18, 08-19, 09-30, 10-22 and 10-23. The browser itself comes
      # from Playwright's CDN, and usually from the cache above.
      - name: Install Playwright Chromium
        working-directory: photo_sync
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 3m python -m playwright install chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt failed or stalled"
            sleep 15
          done
          echo "::error::Playwright install failed 3 times"
          exit 1

      # Without this, a Chromium that can't start would make every Google
      # Photos album come back "unresolved", which is retried quietly rather
      # than alerted. Fail here instead, where it is obvious.
      - name: Check Chromium starts
        working-directory: photo_sync
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.set_content("<p>ok</p>")
              assert page.inner_text("p") == "ok"
              print("Chromium", browser.version, "starts and renders")
              browser.close()
          PY

      - name: Restore dedupe DB
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: photo_sync/photo_sync_state.db
          key: photo-sync-db-${{ github.run_id }}
          restore-keys: |
            photo-sync-db-

      - name: Run sync
        working-directory: photo_sync
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          ONEDRIVE_BASE_FOLDER: ${{ vars.ONEDRIVE_BASE_FOLDER || 'AssetPhotos' }}
          WRITE_BACK_TO_SNIPEIT: ${{ vars.WRITE_BACK_TO_SNIPEIT || 'false' }}
          INCLUDE_HISTORY_NOTES: ${{ vars.INCLUDE_HISTORY_NOTES || 'true' }}
          USE_PLAYWRIGHT: ${{ vars.USE_PLAYWRIGHT || 'true' }}
          FORCE_RESYNC: ${{ github.event.inputs.force || 'false' }}
          LOG_LEVEL: INFO
        run: python sync.py

      # Keep records for files uploaded before a later item failed. Without
      # this explicit save, a red run can restore an older DB next time and
      # upload the successful files again.
      - name: Save dedupe DB
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: photo_sync/photo_sync_state.db
          key: photo-sync-db-${{ github.run_id }}

      # No run artifacts. The dedupe DB used to be uploaded as one, but
      # artifacts on a public repository can be downloaded by anyone signed in
      # to GitHub, and the DB lists asset tags, OneDrive links and file names
      # with employee names in them. The cache above is how the DB persists.
