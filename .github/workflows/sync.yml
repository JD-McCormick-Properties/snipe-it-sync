name: Property Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: property_sync
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
          APPFOLIO_BASE_URL: ${{ secrets.APPFOLIO_BASE_URL }}
          APPFOLIO_SESSION: ${{ secrets.APPFOLIO_SESSION }}
        working-directory: property_sync
        run: python sync_properties.py
