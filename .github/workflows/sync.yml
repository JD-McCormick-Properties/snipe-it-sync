name: Property Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Never two at once. On 2026-10-22 two overlapping runs both tried to upload
# the AppFolio exports to OneDrive and one failed. Shares the group with
# cleanup_locations.yml, which edits the same Snipe-IT locations.
concurrency:
  group: property-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: property_sync
        run: pip install -r requirements.txt

      # The AppFolio exports hold rents and revenue, so they live in OneDrive
      # rather than in this public repository. See property_sync/fetch_data.py.
      - name: Fetch AppFolio exports from OneDrive
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          PROPERTY_DATA_FOLDER: ${{ vars.PROPERTY_DATA_FOLDER || 'JD McCormick Shared Drive/AppFolio Exports' }}
        working-directory: property_sync
        run: python fetch_data.py

      - name: Run sync
        env:
          SNIPE_URL: ${{ secrets.SNIPE_URL }}
          SNIPE_API_KEY: ${{ secrets.SNIPE_API_KEY }}
        working-directory: property_sync
        run: python sync_properties.py
