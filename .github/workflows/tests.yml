name: Tests

on:
  push:
    branches: [main]
    paths:
      - "photo_sync/**"
      - "property_sync/**"
      - "notifications/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "photo_sync/**"
      - "property_sync/**"
      - "notifications/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # No Playwright browsers and no credentials: every test is pure and
      # offline, so this stays a fast check on each push.
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r photo_sync/requirements.txt
          pip install -r property_sync/requirements.txt
          pip install -r notifications/requirements.txt

      - name: Photo sync tests
        working-directory: photo_sync
        run: python -m pytest tests/ -v

      - name: Property sync tests
        working-directory: property_sync
        run: python -m pytest tests/ -v

      - name: Notifier tests
        working-directory: notifications
        run: python -m pytest tests/ -v
