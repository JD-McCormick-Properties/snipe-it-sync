name: Tests

on:
  push:
    branches: [main]
    paths:
      - "photo_sync/**"
      - "property_sync/**"
      - "notifications/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "photo_sync/**"
      - "property_sync/**"
      - "notifications/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      # No Playwright browsers and no credentials: every test is pure and
      # offline, so this stays a fast check on each push.
      - name: Install dependencies
        run: |
          pip install pytest==8.4.2
          pip install -r photo_sync/requirements.txt
          pip install -r property_sync/requirements.txt
          pip install -r notifications/requirements.txt

      - name: Photo sync tests
        working-directory: photo_sync
        run: python -m pytest tests/ -v

      - name: Property sync tests
        working-directory: property_sync
        run: python -m pytest tests/ -v

      - name: Notifier tests
        working-directory: notifications
        run: python -m pytest tests/ -v

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
